[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "index-scanner-mcp"
version = "1.0.0"
description = "Scans codebases for MongoDB and PostgreSQL index definitions, suggests missing indexes, and generates executable scripts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
aurora = [
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
index-scanner-mcp = "index_scanner_mcp.cli:main"
pg-guardrails = "index_scanner_mcp.pg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
